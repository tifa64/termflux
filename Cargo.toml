[package]
name = "termflux"
version = "0.2.0"
edition = "2021"
description = "Animated backgrounds for your terminal"
license = "MIT"
repository = "https://github.com/tndoan/termflux"
homepage = "https://github.com/tndoan/termflux"
readme = "README.md"
keywords = ["terminal", "animation", "tui", "background"]
categories = ["command-line-utilities"]
exclude = ["gif/", "*.cast", "*.swp"]

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
vt100 = "0.15"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
anyhow = "1"
rand = "0.8"
noise = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
